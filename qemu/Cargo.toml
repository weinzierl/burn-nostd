# The Pico 2 programs' code paths on an emulated Cortex-M33 (QEMU mps2-an505):
# same target, allocator and heap size, no hardware. Exit status: pass/fail.
[package]
name = "qemu"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
sine = { path = "../1-sine" }
gesture = { path = "../2-gesture" }
keywords = { path = "../3-keywords" }
tinystories = { path = "../4-tinystories" }
burn = { version = "=0.22.0", default-features = false }
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
cortex-m-semihosting = "0.6"
embedded-alloc = "0.7"
libm = "0.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = "s"
panic = "abort"
