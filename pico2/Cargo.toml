# Firmware for the Raspberry Pi Pico 2 (RP2350, Cortex-M33, 520 KiB SRAM, 4 MiB flash).
[package]
name = "pico2"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
sine = { path = "../1-sine" }
gesture = { path = "../2-gesture" }
keywords = { path = "../3-keywords" }
tinystories = { path = "../4-tinystories" }
burn = { version = "=0.22.0", default-features = false }

embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread", "executor-interrupt", "defmt"] }
embassy-rp = { version = "0.10", features = ["defmt", "time-driver", "critical-section-impl", "rp235xa", "binary-info"] }
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime"] }
embedded-hal-async = "1.0"
embassy-sync = "0.8"
embassy-futures = "0.1"
embassy-usb = { version = "0.6", default-features = false } # tinystories-usb only
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7"
embedded-alloc = "0.7"
static_cell = "2"
libm = "0.2"
defmt = "1.0"
defmt-rtt = "1.0"
panic-probe = { version = "1.0", features = ["print-defmt"] }

[profile.release]
debug = 2 # for defmt and probe-rs; not flashed
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = "s" # unoptimized Burn is too slow and too big
panic = "abort"
